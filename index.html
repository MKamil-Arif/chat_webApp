<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- User Registration Screen -->
        <div id="registerScreen" class="screen active">
            <div class="container">
                <h1>👋 Welcome!</h1>
                <p>Apna naam aur relation batayein</p>
                <form id="registerForm">
                    <div class="form-group">
                        <input type="text" id="userName" placeholder="Aapka naam" required>
                    </div>
                    <div class="form-group">
                        <select id="userRelation" required>
                            <option value="">Mere liye aap kaun hain?</option>
                            <option value="Friend">Friend</option>
                            <option value="Family">Family</option>
                            <option value="Colleague">Colleague</option>
                            <option value="Student">Student</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Chat Start karein</button>
                </form>
            </div>
        </div>

        <!-- User Chat Screen -->
        <div id="chatScreen" class="screen">
            <div class="chat-header">
                <h2>💬 Chat</h2>
                <button id="logoutBtn" class="btn-small">Exit</button>
            </div>
            <div id="messagesContainer" class="messages-container">
                <!-- Messages will appear here -->
            </div>
            <div class="chat-input-container">
                <input type="text" id="messageInput" placeholder="Apna message likhein..." />
                <button id="sendBtn" class="btn-send">Send</button>
            </div>
        </div>

        <!-- ⭐ ADMIN PANEL - REDESIGNED ⭐ -->
        <div id="adminPanel" class="screen">
            <div class="admin-header">
                <div class="admin-header-left">
                    <h2>👑 Admin Dashboard</h2>
                    <span id="totalUsers" class="header-badge">0 Users</span>
                </div>
                <button id="adminLogoutBtn" class="btn-small">Exit</button>
            </div>
            
            <div class="admin-container">
                <!-- Left Sidebar - Users List -->
                <div class="admin-sidebar">
                    <div class="sidebar-search">
                        <input type="text" id="searchUser" placeholder="🔍 Search users..." />
                    </div>
                    <div class="sidebar-header">
                        <span>📋 All Users</span>
                        <span id="userCount" class="count-badge">0</span>
                    </div>
                    <div id="usersList" class="users-list">
                        <!-- Users will appear here -->
                    </div>
                </div>
                
                <!-- Right Side - Chat Area -->
                <div class="admin-chat-area">
                    <div id="selectedUserInfo" class="selected-user-info">
                        <div class="no-user-selected">
                            <div class="no-user-icon">💬</div>
                            <h3>Select a user to start chatting</h3>
                            <p>Click on any user from the left panel</p>
                        </div>
                    </div>
                    <div id="adminMessagesContainer" class="messages-container admin-messages">
                        <!-- Messages will appear here -->
                    </div>
                    <div class="chat-input-container admin-input">
                        <input type="text" id="adminMessageInput" placeholder="Type your reply here..." />
                        <button id="adminSendBtn" class="btn-send">
                            <span>➤</span> Reply
                        </button>
                    </div>
                </div>
                </div>
            </div>
        </div>

    <script src="script.js"></script>
</body>
</html>
